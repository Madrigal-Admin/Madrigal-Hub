<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/logo-madrigal.png?v=2" />
    <link rel="apple-touch-icon" href="/assets/logo-madrigal.png?v=2" />
    <title>Concedii Madrigal</title>
    <script>
      // Legăturile către logo-ul și tema partajate trăiesc la rădăcina
      // reală a site-ului (/assets/...), nu sub /HR/. Scrise așa (ca șir
      // de caractere, în JS), Vite nu le mai "rescrie" greșit din cauza
      // base:'/HR/'. document.write, aici, în <head>, e execuție sincronă,
      // înainte de randare — deci nu mai apare niciun glitch vizual.
      document.write(
        '<link rel="icon" type="image/png" href="' + window.location.origin + '/assets/logo-madrigal.png">' +
        '<link rel="stylesheet" href="' + window.location.origin + '/assets/tema-shared.css?v=5">'
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
